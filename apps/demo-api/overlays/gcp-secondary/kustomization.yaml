apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-api

resources:
  - ../../base

# PILOT LIGHT: the workload is fully defined, reconciled, and image-pulled here
# — it just runs zero copies. Failover is `count: 0` -> `count: 2` in Git.
# This is the whole active-passive posture expressed as one integer.
replicas:
  - name: demo-api
    count: 2

configMapGenerator:
  - name: site
    literals:
      - CLOUD=gcp
      - REGION=europe-west2
      - DR_ROLE=primary
      - WHOAMI_NAME=gcp-secondary

labels:
  - pairs:
      cloud: gcp
      dr.role: primary
    includeSelectors: false
