apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-api

resources:
  - ../../base

# ACTIVE side: serving traffic.
replicas:
  - name: demo-api
    count: 2

configMapGenerator:
  - name: site
    literals:
      - CLOUD=aws
      - REGION=eu-west-1
      - DR_ROLE=primary

labels:
  - pairs:
      cloud: aws
      dr.role: primary
    includeSelectors: false
