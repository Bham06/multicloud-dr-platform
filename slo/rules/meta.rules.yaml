# Hand-written. NOT generated by `make slo`, which only rewrites dr.rules.yaml.
#
# These watch the measurement chain rather than the service. They exist because
# the availability SLI deliberately EXCLUDES steps where nothing was watching,
# instead of counting them as downtime.
#
# That exclusion is necessary — counting "not measured" as "down" made every
# long burn-rate window read ~99% error for days after deployment and left the
# alert permanently on. But it leaves a real gap: if the prober disappears from
# service discovery entirely, the SLI quietly stops accumulating and a silent
# SLO looks exactly like a healthy one.
#
# So "we are not measuring" gets its own alert. It is not an availability
# problem and must not be scored as error budget; it is an instrumentation
# outage, and it is urgent for a different reason.
groups:
  - name: dr-meta
    rules:
      - alert: DRAvailabilityUnmeasured
        # absent() rather than up == 0. Those are different conditions and the
        # difference is the whole point: up == 0 means the prober was scraped
        # and did not answer, which IS an outage and the SLI already counts it.
        # absent() means there is no target at all — nobody is even trying.
        expr: absent(up{job="dr-edge"})
        for: 5m
        labels:
          severity: ticket
          pillar: availability
        annotations:
          summary: >-
            The availability SLO has no prober to read. The scrape target has
            gone from service discovery, so the SLI is not accumulating and a
            healthy-looking number means nothing.
          runbook: docs/runbooks/failover.md

      - alert: DRProbeStale
        # The prober's HTTP endpoint is nginx serving a file that a shell loop
        # rewrites. If the loop stalls and nginx does not, the endpoint keeps
        # answering with the last verdict it wrote — a stale 1 reads exactly
        # like a healthy service. The SLI excludes those steps rather than
        # believing them, which is correct but silent, so the staleness itself
        # is alerted here.
        #
        # On this substrate it fires under host contention rather than because
        # the loop died: both observed episodes coincided with Argo syncing and
        # pods rolling on a VM that is already swapping. That is a lab
        # limitation and worth seeing, not worth hiding.
        expr: (time() - dr_probe_timestamp_seconds) > 120
        for: 2m
        labels:
          severity: ticket
          pillar: availability
        annotations:
          summary: >-
            The outside-in prober has stopped sweeping. Availability is not
            being scored while this holds — the SLI skips those steps rather
            than trusting the last value the prober wrote.
          runbook: docs/runbooks/failover.md
