# SLO definitions, in Sloth's spec format.
#
# Committed as source, with the generated Prometheus rules committed alongside
# them. The README's claim that SLOs are code only means something if the rules
# a reviewer reads in a PR are the rules that actually run.
#
# Regenerate with `make slo` after editing.
#
# NOTE: no cluster name appears anywhere in this file, including in prose —
# Sloth bakes descriptions into rule annotations, so they end up in a base and
# the portability guard rejects them. That constraint is doing real work here:
# see the dr_role note on the availability SLO.
version: prometheus/v1
service: dr
labels:
  owner: platform
slos:
  # ---------------------------------------------------------------------
  # The DR SLO. Replication lag IS the RPO exposure, so this is the SLI
  # that says whether the standby is actually usable.
  #
  # Health requires BOTH conditions: worker up AND lag inside RPO. Lag
  # alone is the trap — a stopped subscriber reports lag 0 while falling
  # arbitrarily far behind, so a lag-only SLI reads healthiest at exactly
  # the moment replication has died.
  # ---------------------------------------------------------------------
  - name: replication-freshness
    objective: 99.0
    description: >-
      The standby is receiving changes from the primary and is within the RPO
      target of minutes.
    sli:
      raw:
        error_ratio_query: |
          1 - (
            avg_over_time(
              (
                (max without(pod, instance, job) (cnpg_dr_subscription_worker_up) == bool 1)
                *
                (max without(pod, instance, job) (cnpg_dr_subscription_lag_seconds) < bool 60)
              )[{{.window}}:30s]
            )
            or on() vector(0)
          )
    alerting:
      name: DRReplicationStale
      labels:
        pillar: dr
      annotations:
        runbook: docs/runbooks/failover.md
        summary: >-
          Replication from the primary to the standby is stale or stopped. RPO
          is not being met; a failover now would lose data.
      page_alert:
        labels:
          severity: page
      ticket_alert:
        labels:
          severity: ticket

  # ---------------------------------------------------------------------
  # Availability of whichever side is currently ACTIVE, probed by the
  # collector's httpcheck receiver.
  #
  # Filtered on dr_role="primary" and never on a cluster name. The standby
  # runs the pilot light at zero replicas, so its probe fails by design and
  # must not burn error budget. But hardcoding the active cluster's name
  # would mean this SLO keeps measuring the demoted side after a failover
  # and stops measuring the one actually serving traffic — broken at
  # precisely the moment it matters most. The role label flips in Git as
  # part of the failover change, so the SLO follows the traffic.
  # ---------------------------------------------------------------------
  - name: demo-api-availability
    objective: 99.5
    description: >-
      demo-api on the active cluster answers HTTP probes successfully.
    sli:
      events:
        error_query: |
          sum(rate(httpcheck_status{dr_role="primary", status_code!~"2.."}[{{.window}}]))
        total_query: |
          sum(rate(httpcheck_status{dr_role="primary"}[{{.window}}]))
    alerting:
      name: DemoAPIUnavailable
      labels:
        pillar: availability
      annotations:
        summary: demo-api on the active cluster is failing HTTP probes.
      page_alert:
        labels:
          severity: page
      ticket_alert:
        labels:
          severity: ticket
