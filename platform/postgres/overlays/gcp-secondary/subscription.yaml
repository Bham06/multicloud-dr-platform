# The subscriber side of logical replication.
#
# This is an ordinary client connection to the publisher — not streaming
# replication — which is exactly why it works between two unrelated managed
# Postgres services (RDS -> Cloud SQL) where physical replication cannot.
#
# What it carries: row changes (INSERT/UPDATE/DELETE).
# What it does NOT carry: DDL, and sequence values. Both are recorded as
# traps in docs/portability-register.md and handled in the failover runbook.
apiVersion: postgresql.cnpg.io/v1
kind: Subscription
metadata:
  name: app-sub
spec:
  cluster:
    name: pg
  dbname: app
  name: app_sub
  externalClusterName: aws-primary-pg
  publicationName: app_pub
