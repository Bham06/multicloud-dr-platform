# The subscriber side of logical replication.
#
# This is an ordinary client connection to the publisher — not streaming
# replication — which is exactly why it works between two unrelated managed
# Postgres services (RDS -> Cloud SQL) where physical replication cannot.
#
# What it carries: row changes (INSERT/UPDATE/DELETE).
# What it does NOT carry: DDL, and sequence values. Both are recorded as
# traps in docs/portability-register.md and handled in the failover runbook.
apiVersion: postgresql.cnpg.io/v1
kind: Subscription
metadata:
  name: app-sub
spec:
  cluster:
    name: pg
  dbname: app
  name: app_sub
  externalClusterName: gcp-secondary-pg
  publicationName: app_pub
  parameters:
    # Explicit even though it is the CREATE SUBSCRIPTION default. This is the
    # re-seed: the subscriber's copy of the table is discarded and refilled from
    # the publisher. Safe here only because the divergence was checked first and
    # the old primary proved to be a byte-identical prefix — see step 1 of
    # docs/runbooks/failback.md. The table must be empty before this runs, or
    # the initial COPY collides on the primary key.
    copy_data: "true"
