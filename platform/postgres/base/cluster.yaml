apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
spec:
  instances: 1

  postgresql:
    parameters:
      # Required for logical replication. Set on BOTH sides, not just the
      # publisher: after a failover the roles reverse, and a standby that was
      # never configured to publish cannot become a primary that does.
      wal_level: logical
      max_wal_senders: "10"
      max_replication_slots: "10"

  bootstrap:
    initdb:
      database: app
      owner: app
      # Same credential on both clusters — the subscriber opens an ordinary
      # client connection to the publisher, so they must agree. Applied out of
      # band by scripts/sync-db-credentials.sh; never committed.
      secret:
        name: pg-app-credentials

      postInitSQL:
        - ALTER ROLE app WITH REPLICATION

      # ---------------------------------------------------------------------
      # THE SCHEMA LIVES HERE, AND THAT IS THE POINT.
      #
      # Logical replication carries rows, not DDL. The subscriber must already
      # have the tables or replication fails on the first change. Putting the
      # schema in the shared base means Git — not replication — is what keeps
      # the two sides in step, and the portability guard proves both clusters
      # got the identical definition.
      #
      # The corollary is the trap recorded in the portability register: a
      # migration applied only to the primary breaks the standby silently.
      # ---------------------------------------------------------------------
      postInitApplicationSQL:
        - |
          CREATE TABLE IF NOT EXISTS orders (
            id         bigserial PRIMARY KEY,
            payload    text NOT NULL,
            created_at timestamptz NOT NULL DEFAULT now()
          )
        - ALTER TABLE orders OWNER TO app
        - ALTER SEQUENCE orders_id_seq OWNER TO app

  storage:
    # No storageClass on purpose: it is a per-cloud concern (gp3 on AWS,
    # pd-balanced on GCP, local-path here). Naming one in the base would pin
    # the workload to a single environment.
    size: 1Gi

  resources:
    requests:
      cpu: 50m
      memory: 160Mi
    limits:
      memory: 400Mi

  enableSuperuserAccess: false
