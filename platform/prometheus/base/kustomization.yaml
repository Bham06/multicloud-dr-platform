apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prometheus

resources:
  - config.yaml
  - deployment.yaml

# Rules are generated from slo/dr.yaml by `make slo` and committed, so the
# rules a reviewer reads in a PR are the rules that actually run.
configMapGenerator:
  - name: prometheus-rules
    files:
      - rules/dr.rules.yaml
generatorOptions:
  disableNameSuffixHash: true
