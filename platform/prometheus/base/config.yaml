apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yaml

    scrape_configs:
      # Prometheus receives everything else by remote-write from the two OTel
      # collectors, so the only thing it scrapes is itself.
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
