apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
  # No storageClassName on purpose: it is a per-cloud concern (gp3 on AWS,
  # pd-balanced on GCP, local-path here), exactly as in platform/postgres.
  # Naming one would pin this to a single environment.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the data PVC is ReadWriteOnce, so a new pod
  # cannot mount it while the old one still holds it and the rollout would
  # deadlock. Single-replica evaluator, so there is nothing to gain from
  # overlapping pods anyway.
  #
  # MIGRATION TRAP, if you ever flip this on a Deployment that already exists:
  # the API server defaults spec.strategy.rollingUpdate when type is
  # RollingUpdate, and server-side apply MERGES rather than replaces — so it
  # keeps that block and rejects the result with
  #
  #   spec.strategy.rollingUpdate: Forbidden: may not be specified when
  #   strategy `type` is 'Recreate'
  #
  # Argo retries forever and the Application sits OutOfSync with a stale
  # error. One-time fix on the live object, after which Git converges:
  #
  #   kubectl -n prometheus patch deploy prometheus --type=json -p \
  #     '[{"op":"remove","path":"/spec/strategy/rollingUpdate"},
  #       {"op":"replace","path":"/spec/strategy/type","value":"Recreate"}]'
  #
  # A cluster built fresh from this repo never hits it — the Deployment is
  # created as Recreate and the defaulted field never exists.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.14.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # Short retention on purpose: this is an SLO evaluator, not an
            # archive. Long-term storage is Grafana Cloud's job, which also
            # keeps history outside both clouds where a failover can still
            # reach it.
            #
            # CAVEAT: the SLO period is 30d but retention is 24h, so
            # `slo:period_error_budget_remaining` is not meaningful in this
            # lab — it averages over a window that is mostly empty. Burn rate
            # and the short-window error ratios are the signals to trust here.
            # Grafana Cloud holds the history that makes the budget real.
            - --storage.tsdb.retention.time=24h
            # The two collectors push rather than being scraped, so the
            # primary's metrics traverse the interconnect exactly once.
            - --web.enable-remote-write-receiver
            - --web.enable-lifecycle
          ports:
            - name: web
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: targets
              mountPath: /etc/prometheus/targets
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 50m
              memory: 200Mi
            limits:
              memory: 450Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        # Not optional: a missing target list must stop the pod, not silently
        # leave the availability SLO with nothing to measure. Absent monitoring
        # that looks fine is the failure mode this whole milestone is about.
        - name: targets
          configMap:
            name: prometheus-targets
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-server
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: web
      port: 80
      targetPort: web
      # Reachable across the interconnect at 172.30.0.20:30909 so the
      # aws-primary collector can remote-write into it.
      nodePort: 30909
