apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.14.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # Short retention on purpose: this is an SLO evaluator, not an
            # archive. Long-term storage is Grafana Cloud's job, which also
            # keeps history outside both clouds where a failover can still
            # reach it.
            - --storage.tsdb.retention.time=2h
            # The two collectors push rather than being scraped, so the
            # primary's metrics traverse the interconnect exactly once.
            - --web.enable-remote-write-receiver
            - --web.enable-lifecycle
          ports:
            - name: web
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 50m
              memory: 200Mi
            limits:
              memory: 450Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-server
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: web
      port: 80
      targetPort: web
      # Reachable across the interconnect at 172.30.0.20:30909 so the
      # aws-primary collector can remote-write into it.
      nodePort: 30909
