apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prometheus
resources:
  - ../../base

# The prober's address is environment-specific, so it lands here rather than in
# the base — the same split the otel-collector overlay uses for its remote-write
# endpoint. The base owns the job name; only the address is local knowledge.
configMapGenerator:
  - name: prometheus-targets
    files:
      - targets/dr-edge.yaml
