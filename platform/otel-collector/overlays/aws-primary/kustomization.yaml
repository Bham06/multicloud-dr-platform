apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: otel-collector
resources:
  - ../../base
configMapGenerator:
  - name: otel-cluster-facts
    behavior: create
    literals:
      - cluster=aws-primary
      - drRole=standby
      # The evaluator lives outside both clusters (ADR 0006), so both sides
      # push to the same address over the interconnect. The standby used to
      # get an in-cluster shortcut; now neither side has one, which means the
      # path is exercised identically from both.
      - remoteWriteEndpoint=http://172.30.0.40:9090/api/v1/write
generatorOptions:
  disableNameSuffixHash: true
