apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: otel-collector
resources:
  - ../../base
configMapGenerator:
  - name: otel-cluster-facts
    behavior: create
    literals:
      - cluster=aws-primary
      - drRole=standby
      # The evaluator lives outside both clusters (ADR 0006), so both sides
      # push to the same address over the interconnect. The standby used to
      # get an in-cluster shortcut; now neither side has one, which means the
      # path is exercised identically from both.
      - remoteWriteEndpoint=http://172.30.0.40:9090/api/v1/write
# The hash suffix is deliberately LEFT ON. These literals are consumed as
# configMapKeyRef env vars, which a pod reads once at startup, so a stable name
# means an edit lands in the ConfigMap and never reaches the running collector.
# That is the same trap the base documents for otel-collector-config, and it
# bit twice here: the remote-write endpoint kept pointing at the old evaluator,
# and the drRole flip that promote.sh performs never took effect at all — the
# collector went on stamping every metric with the pre-failover role.
