apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.158.0
          args: ["--config=/conf/collector.yaml"]
          env:
            - name: CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: otel-cluster-facts
                  key: cluster
            - name: REMOTE_WRITE_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: otel-cluster-facts
                  key: remoteWriteEndpoint
            - name: DR_ROLE
              valueFrom:
                configMapKeyRef:
                  name: otel-cluster-facts
                  key: drRole
          volumeMounts:
            - name: config
              mountPath: /conf
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
