# Collector config — IDENTICAL on both clusters.
#
# Written as plain manifests rather than inflated from the upstream chart: the
# chart merges its own defaults into `config` and ignores null overrides in
# 0.170.0, so jaeger/zipkin/otlp receivers and traces/logs pipelines survive no
# matter what you set. They would bind ports and consume memory for a project
# that ships neither traces nor logs.
#
# The two values that genuinely differ per cluster arrive as env vars from the
# otel-cluster-facts ConfigMap each overlay supplies. The pipeline itself is
# portable, which is the whole point of standardising on the collector.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  collector.yaml: |
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: cnpg
              scrape_interval: 15s
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [postgres]
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
                  regex: .+
                  action: keep
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  regex: "9187"
                  action: keep
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace

      # Availability and latency SLIs without a separate blackbox pod.
      httpcheck:
        collection_interval: 15s
        targets:
          - endpoints:
              - http://demo-api.demo-api.svc.cluster.local
            method: GET

    processors:
      batch:
        timeout: 10s
      resource:
        attributes:
          # The label that lets one Prometheus tell the two clusters apart.
          - key: cluster
            value: ${env:CLUSTER_NAME}
            action: upsert

    exporters:
      prometheusremotewrite:
        endpoint: ${env:REMOTE_WRITE_ENDPOINT}
        tls:
          insecure: true
        # Without this the `cluster` resource attribute never becomes a
        # Prometheus label and series from both clusters collide.
        resource_to_telemetry_conversion:
          enabled: true

    service:
      telemetry:
        metrics:
          level: basic
      pipelines:
        metrics:
          receivers: [prometheus, httpcheck]
          processors: [resource, batch]
          exporters: [prometheusremotewrite]
